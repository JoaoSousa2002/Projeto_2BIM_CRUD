<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDoTask</title>
</head>
<style>
    *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
 
    body {
        background-color: #ffffff;
        color: #111111;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 0.9rem;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
    }
 
    #Container {
        width: 100%;
        max-width: 400px;
    }
 
    #Filho {
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        padding: 2rem;
    }
 
    .topo {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
        border-bottom: 1px solid #e8e8e8;
        padding-bottom: 1rem;
    }
 
    h3 {
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: -0.01em;
    }
 
    #botao-voltar {
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 0.3rem 0.7rem;
        font-size: 0.8rem;
        background: #fff;
        color: #111;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
        white-space: nowrap;
    }
 
    #botao-voltar:hover {
        background: #111;
        color: #fff;
        border-color: #111;
    }
 
    #meuForm label {
        display: block;
        margin-bottom: 1rem;
        font-size: 0.82rem;
        color: #444;
        font-weight: 500;
    }
 
    #meuForm input[type="text"] {
        display: block;
        width: 100%;
        margin-top: 0.3rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 0.45rem 0.65rem;
        font-size: 0.85rem;
        outline: none;
        background: #fff;
        color: #111;
        transition: border-color 0.15s;
    }
 
    #meuForm input[type="text"]:focus {
        border-color: #111;
    }
 
    #Descricao {
        display: block;
        width: 100%;
        margin-top: 0.3rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 0.45rem 0.65rem;
        font-size: 0.85rem;
        outline: none;
        background: #fff;
        color: #111;
        resize: none;
        font-family: inherit;
        transition: border-color 0.15s;
    }
 
    #Descricao:focus {
        border-color: #111;
    }
 
    fieldset {
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        padding: 0.75rem 1rem;
        margin-bottom: 1rem;
    }
 
    legend {
        font-size: 0.78rem;
        font-weight: 600;
        color: #444;
        padding: 0 0.3rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
    }
 
    fieldset label {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        margin-bottom: 0 !important;
        margin-right: 1rem;
        font-size: 0.85rem;
        color: #111;
        font-weight: 400;
        cursor: pointer;
    }
 
    input[type="radio"] {
        accent-color: #111;
        cursor: pointer;
    }
 
    input[type="submit"] {
        display: block;
        width: 100%;
        margin-top: 1.25rem;
        border: 1px solid #111;
        border-radius: 4px;
        padding: 0.55rem;
        font-size: 0.85rem;
        font-weight: 500;
        background: #111;
        color: #fff;
        cursor: pointer;
        transition: background 0.15s, color 0.15s;
    }
 
    input[type="submit"]:hover {
        background: #fff;
        color: #111;
    }

</style>

<body>

    <div id="Container">
        <!--Daqui será feita a adição de objetivos no Banco de dados -->
        <div id="Filho">
            <input type="button" onclick="location.href='Index.html'" value="Voltar" id="botao-voltar" />
            <h3 style="display: inline;">Atualizar objetivo</h3>

            <form id="meuForm">

                <label for="nome-objetivo">Nome do objetivo:
                    <input type="text" id="nome-objetivo" name="nome-objetivo" maxlength="30">
                </label>
                <br>
                <label for="Descricao">Descrição:
                    <textarea id="Descricao" name="Descricao" maxlength="300" wrap="soft" rows="10"
                        cols="47"></textarea>
                </label>
                <br>

                <fieldset>
                    <legend>Progresso</legend>
                    <label for="Progresso">Não iniciado
                        <input type="radio" name="Progresso" id="status" value="Não iniciado">
                    </label>
                    <Label for="Progresso"> Em progresso
                        <input type="radio" name="Progresso" id="status" value="Em progresso">
                    </Label>
                    <label for="Progresso">Finalizado
                        <input type="radio" name="Progresso" id="status" value="Finalizado">
                    </label>
                </fieldset>

                <br>
                <input type="submit" value="Enviar">
            </form>

        </div>
    </div>
    <script>
        console.log(localStorage.getItem('objetivoAtualizar'));

        //Converte a string do localstorage em JSON
        listaAtualizar = JSON.parse(localStorage.getItem('objetivoAtualizar'))

        //Coloca os dados do localstorage nos campos do formulario
        document.getElementById('nome-objetivo').value = listaAtualizar.nome
        document.getElementById('Descricao').value = listaAtualizar.descricao
        const radio = document.querySelector(`input[name="Progresso"][value="${listaAtualizar.status}"]`);
        if (radio) { radio.checked = true }

        //Pega os dados do localStorage
        const id = listaAtualizar.id
        const data_inicio = listaAtualizar.data_inicio
            ? listaAtualizar.data_inicio.split('T')[0]
            : null

        console.log(listaAtualizar.status)



        document.getElementById('meuForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('nome-objetivo').value
            const descricao = document.getElementById('Descricao').value
            const status = document.querySelector('input[name="Progresso"]:checked').value;

            const response = await fetch(`http://localhost:3000/UPDATE/`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, nome, descricao, status, data_inicio })
            });
            const data = await response.json();
            console.log(data.mensagem)


            window.location.href = 'Index.html';
        })
    </script>
</body>

</html>
