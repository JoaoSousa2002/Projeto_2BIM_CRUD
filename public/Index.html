<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDoTask</title>
</head>
<style>
    *,
    *::before,
    *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 2rem 1rem;
        background-color: #ffffff;
        color: #111111;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 0.9rem;
    }

    h1 {
        font-size: 1.4rem;
        font-weight: 600;
        margin-bottom: 1.5rem;
        letter-spacing: -0.02em;
    }

    #meuForm {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
    }

    #meuForm label {
        font-size: 0.85rem;
        color: #444;
        display: flex;
        align-items: center;
        gap: 0.4rem;
    }

    input[type="text"] {
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 0.4rem 0.65rem;
        font-size: 0.85rem;
        outline: none;
        transition: border-color 0.15s;
        background: #fff;
        color: #111;
    }

    input[type="text"]:focus {
        border-color: #111;
    }

    input[type="submit"],
    input[type="button"] {
        border: 1px solid #111;
        border-radius: 4px;
        padding: 0.4rem 0.85rem;
        font-size: 0.85rem;
        background: #111;
        color: #fff;
        cursor: pointer;
        transition: background 0.15s, color 0.15s;
    }

    input[type="submit"]:hover,
    input[type="button"]:hover {
        background: #fff;
        color: #111;
    }

    #divHistorico {
        width: 100%;
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.83rem;
        letter-spacing: 0.01em;
        table-layout: fixed;
    }

    thead tr {
        border-bottom: 2px solid #111;
    }

    th {
        padding: 0.6rem 0.9rem;
        text-align: left;
        font-weight: 600;
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #444;
    }

    td {
        padding: 0.6rem 0.9rem;
        border-bottom: 1px solid #e8e8e8;
        color: #111;
        max-width: 150px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    td:last-of-type {
        text-align: center;
    }

    tbody tr:hover {
        background-color: #f7f7f7;
    }

    button {
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 0.25rem 0.65rem;
        font-size: 0.78rem;
        background: #fff;
        color: #111;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
        margin: 2px 0;
    }

    button:hover {
        background: #111;
        color: #fff;
        border-color: #111;
    }

    #Lista-objetivos {
        font-size: 0.85rem;
        color: #666;
        display: block;
        margin-bottom: 0.75rem;
    }
</style>

<body>

    <h1>Lista de objetivos</h1>

    <form id="meuForm">
        <label for="nomeAluno">Nome do objetivo:
            <input type="text" id="nome-objetivo">
        </label>
        <input type="submit" value="Pesquisar">
        <input type="button" onclick="location.href='AdicionarObjetivo.html'" value="Adicionar objetivo">
    </form>
    <br>
    <p style="display: inline;" id="Lista-objetivos"></p>
    <div id="divHistorico">
        <table>
            <thead>
                <tr>
                    <th scope="col" style="width: 80px;" >id</th>
                    <th scope="col" style="width: 250px;">Objetivo</th>
                    <th scope="col" style="width: 250px;">Descrição</th>
                    <th scope="col" style="width: 120px;">Status</th>
                    <th scope="col" style="width: 150px;">Data inicio</th>
                    <th scope="col" style="width: 150px;">Data fim</th>
                    <th scope="col" style="width: 80px;">Opções</th>
                </tr>

            </thead>
            <tbody id="corpoTabelaObjetivos">
                <!-- Esse campo será preenchido pela função RenderizarTabelaHistorico pelo Javascript-->
            </tbody>
        </table>
    </div>
    </label>
    </div>


    <script>
        let listaObjetivos = []

        function editar(x) {
            const objetivo = listaObjetivos.find(c => c.id === x);
            localStorage.setItem('objetivoAtualizar', JSON.stringify(objetivo))
            console.log(listaObjetivos[objetivo])
            window.location.href = 'AtualizarObjetivo.html';
        }
        async function excluir(x) {
            const response = await fetch(`http://localhost:3000/DELETE/?id=${x}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': 'Bearer YOUR_TOKEN' // Destructive actions usually require authentication
                }

            })
            const data = await response.json();
            alert(data.mensagem);
            window.location.href = 'Index.html';
        }

        document.getElementById('meuForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            //Atualizar a pagina

            const nomePesquisa = document.getElementById('nome-objetivo').value;

            //Foi feito o uso de query no corpo do http pois o metodo get não recebe body como os demais
            const response = await fetch(`http://localhost:3000/?nome=${nomePesquisa}`, {
                method: 'GET',
                headers: { 'Content-Type': 'application/json' }
            });
            const dados = await response.json();
            console.log('dados recebidos:', dados)
            listaObjetivos = dados

            // RenderizaTabelaObjetivos()
            document.getElementById('corpoTabelaObjetivos').innerHTML = listaObjetivos.map(c =>
                `
                <tr>
                    <td>${c.id}</td>
                    <td>${c.nome}</td>
                    <td>${c.descricao}</td>
                    <td>${c.status}</td>
                    <td>${c.data_inicio ? new Date(c.data_inicio).toLocaleDateString('pt-BR') : '---'}</td>
                    <td>${c.data_fim ? new Date(c.data_fim).toLocaleDateString('pt-BR') : '---'}</td>
                    <td>
                        <button onclick="editar(${c.id})">Ver/Editar</button>
                    <br>
                        <button onclick="excluir(${c.id})">Excluir</button>
                    </td>
                    </tr>
            `).join("");
            console.log("Renderizado")
        })

    </script>
</body>

</html>
